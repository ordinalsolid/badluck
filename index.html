<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Bad Luck - The Ominous Gaze</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Limelight&family=Poiret+One&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0210;
      font-family: 'Limelight', 'Poiret One', cursive, sans-serif;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Art Deco UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .header-title {
      font-family: 'Limelight', sans-serif;
      font-size: clamp(3rem, 8vw, 6.5rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #ffeb3b;
      text-shadow: 
        0 0 10px rgba(255, 235, 59, 0.8),
        0 0 25px rgba(255, 215, 0, 0.5),
        2px 2px 0px #000;
      text-align: center;
      line-height: 0.9;
      transform: scaleY(1.3);
      margin-top: 10px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
      color: #ffeb3b;
      font-family: 'Poiret One', sans-serif;
      font-weight: 700;
      text-shadow: 0 0 8px rgba(255, 235, 59, 0.6);
    }

    .hud-box {
      background: rgba(15, 3, 25, 0.65);
      border: 2px solid #ffeb3b;
      box-shadow: 0 0 15px rgba(255, 235, 59, 0.3), inset 0 0 10px rgba(255, 235, 59, 0.2);
      padding: 12px 24px;
      border-radius: 4px;
      min-width: 180px;
    }

    .hud-label {
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #e0aaff;
    }

    .hud-value {
      font-family: 'Limelight', sans-serif;
      font-size: 2.2rem;
      color: #ffeb3b;
    }

    /* Screen Overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: rgba(10, 2, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .overlay-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .deco-card {
      border: 3px double #ffeb3b;
      box-shadow: 0 0 30px rgba(255, 235, 59, 0.4), inset 0 0 20px rgba(255, 235, 59, 0.15);
      padding: 40px 60px;
      text-align: center;
      max-width: 550px;
      background: rgba(18, 4, 30, 0.95);
    }

    .deco-card h2 {
      font-family: 'Limelight', sans-serif;
      font-size: 3.5rem;
      color: #ffeb3b;
      letter-spacing: 0.2em;
      margin-bottom: 15px;
      text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
      transform: scaleY(1.2);
    }

    .deco-card p {
      font-family: 'Poiret One', sans-serif;
      font-size: 1.35rem;
      color: #f0c6ff;
      line-height: 1.6;
      margin-bottom: 30px;
      font-weight: 600;
    }

    .btn-deco {
      font-family: 'Limelight', sans-serif;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      color: #0b0210;
      background: linear-gradient(185deg, #fff3a1, #ffeb3b, #d4af37);
      border: 2px solid #ffeb3b;
      padding: 14px 38px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-deco:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(255, 235, 59, 0.9);
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Art Deco UI -->
    <div class="ui-layer">
      <div class="header-title">BAD LUCK</div>
      <div class="hud">
        <div class="hud-box">
          <div class="hud-label">Chaos Score</div>
          <div class="hud-value" id="scoreDisplay">0</div>
        </div>
        <div class="hud-box" style="text-align: right;">
          <div class="hud-label">Multiplier</div>
          <div class="hud-value" id="comboDisplay">1.0x</div>
        </div>
      </div>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay" class="overlay-screen">
      <div class="deco-card">
        <h2>BAD LUCK</h2>
        <p>Direct the giant cat's <strong>Ominous Gaze</strong> using your cursor or finger to blast away lucky <strong>4-Leaf Clovers</strong> (scaled 2x size)!<br/><br/>Keep your beam locked on them to shatter their good fortune before time runs out.</p>
        <button class="btn-deco" onclick="startGame()">UNLEASH GAZE</button>
      </div>
    </div>

    <!-- Game Over Overlay -->
    <div id="gameOverOverlay" class="overlay-screen hidden">
      <div class="deco-card">
        <h2 style="color: #ff5252;">CURSED</h2>
        <p>Final Score: <span id="finalScore" style="color:#ffeb3b; font-weight:bold;">0</span></p>
        <button class="btn-deco" onclick="startGame()">RESTART GAZE</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // UI Elements
    const scoreDisplay = document.getElementById('scoreDisplay');
    const comboDisplay = document.getElementById('comboDisplay');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalScore = document.getElementById('finalScore');

    // Web Audio API Synth Engine
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playLaserSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
    }

    function playShatterSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    // Load User's Cat Image
    const catImage = new Image();
    // Inline data URL version of the cat artwork (Yellow pixel outline, black silhouette, yellow almond eyes)
    catImage.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAl8AAAOECAYAAACfMVRFAAAfpElEQVR42u3de3hkZX3A8fckk2wCu+gCAEB8AQCILwAAxBcAQCf4fxydhYBwrFhnAAAAAElFTkSuQmCC';

    // Game State
    let isPlaying = false;
    let score = 0;
    let combo = 1.0;
    let gameTime = 0;
    let lastTime = 0;
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let clovers = [];
    let particles = [];
    let spawnTimer = 0;

    // Responsive Canvas Resizing
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Mouse / Touch Controls
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
      }
    });

    // 4-Leaf Clover Class (2x Enlarged Size)
    class FourLeafClover {
      constructor() {
        this.radius = Math.random() * 15 + 50; // Twice as big (50px to 65px radius)
        this.x = Math.random() * (canvas.width - 200) + 100;
        this.y = -this.radius * 2;
        this.speedY = Math.random() * 1.5 + 1.2;
        this.speedX = Math.sin(Math.random() * Math.PI * 2) * 1.2;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.03;
        this.hp = 100;
        this.maxHp = 100;
        this.targetGazeTimer = 0;
      }

      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.rotation += this.rotSpeed;

        // Bounce off walls
        if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) {
          this.speedX *= -1;
        }
      }

      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        // Outer Glow
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = this.targetGazeTimer > 0 ? 30 : 15;

        // Render 4-Leaf Clover Shape (2x Larger)
        const scale = this.radius / 30;
        ctx.fillStyle = this.targetGazeTimer > 0 ? '#ffeb3b' : '#00e676';
        ctx.strokeStyle = '#ffff00';
        ctx.lineWidth = 3;

        // Draw 4 leaves around center
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.arc(0, -14 * scale, 14 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // Center Stem / Core
        ctx.fillStyle = '#1b5e20';
        ctx.beginPath();
        ctx.arc(0, 0, 6 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Draw Health / Curse Ring if being hit
        if (this.hp < this.maxHp) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius + 12, 0, (Math.PI * 2) * (this.hp / this.maxHp));
          ctx.strokeStyle = '#ffeb3b';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.restore();
        }
      }
    }

    // Particle Effect for Shattered Clovers
    class SparkParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 8;
        this.vy = (Math.random() - 0.5) * 8;
        this.life = 1.0;
        this.decay = Math.random() * 0.04 + 0.02;
        this.color = Math.random() > 0.5 ? '#ffeb3b' : '#00e676';
        this.size = Math.random() * 8 + 4;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= this.decay;
      }
      draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 10;
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.restore();
      }
    }

    // Background Layered Colors (Exact Graphic Bands)
    function drawBackground() {
      const h = canvas.height;
      const w = canvas.width;

      // 4 Color Stripes: Sky Blue -> Purple -> Magenta
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0.00, '#38b6ff'); // Bright Sky Blue
      grad.addColorStop(0.35, '#5c4d9a'); // Violet Purple
      grad.addColorStop(0.65, '#8c116c'); // Deep Magenta
      grad.addColorStop(1.00, '#e6005c'); // Hot Pink Magenta

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }

    // Draw Giant Screen-Filling Pixel Cat
    function drawCat() {
      ctx.save();
      ctx.imageSmoothingEnabled = false; // Preserve crisp pixel-art style

      const h = canvas.height * 0.85;
      const aspect = catImage.width / catImage.height || 0.67;
      const w = h * aspect;
      const x = (canvas.width - w) / 2;
      const y = canvas.height - h;

      if (catImage.complete && catImage.naturalWidth !== 0) {
        ctx.drawImage(catImage, x, y, w, h);
      } else {
        // Fallback cat drawing matching exact shape if image is loading
        ctx.fillStyle = '#000000';
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 8;
        
        ctx.beginPath();
        ctx.ellipse(canvas.width / 2, canvas.height * 0.6, w * 0.35, h * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
      return { eyeX: canvas.width * 0.44, eyeY: canvas.height * 0.45 };
    }

    // Ominous Gaze Lasers
    function drawGazeBeams(eyePos) {
      if (!isPlaying) return;

      ctx.save();
      ctx.shadowColor = '#ffff00';
      ctx.shadowBlur = 20;

      // Dual Gaze Beams from Left & Right Eyes to Mouse Position
      const eyes = [
        { x: eyePos.eyeX - 35, y: eyePos.eyeY },
        { x: eyePos.eyeX + 35, y: eyePos.eyeY }
      ];

      eyes.forEach(eye => {
        ctx.beginPath();
        ctx.moveTo(eye.x, eye.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(eye.x, eye.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Target Reticle
      ctx.beginPath();
      ctx.arc(mouse.x, mouse.y, 20, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.restore();

      playLaserSound();
    }

    // Start Game
    function startGame() {
      initAudio();
      score = 0;
      combo = 1.0;
      clovers = [];
      particles = [];
      isPlaying = true;

      scoreDisplay.innerText = '0';
      comboDisplay.innerText = '1.0x';

      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');

      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    }

    // Main Game Loop
    function gameLoop(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Draw Background
      drawBackground();

      // 2. Spawn 2x Size 4-Leaf Clovers
      if (isPlaying) {
        spawnTimer += delta;
        if (spawnTimer > 1.2) {
          clovers.push(new FourLeafClover());
          spawnTimer = 0;
        }
      }

      // 3. Update & Draw Clovers
      for (let i = clovers.length - 1; i >= 0; i--) {
        const c = clovers[i];
        c.update();
        c.draw(ctx);

        // Check if Gaze Beam intersects Clover
        const dist = Math.hypot(mouse.x - c.x, mouse.y - c.y);
        if (dist < c.radius + 20 && isPlaying) {
          c.targetGazeTimer = 0.1;
          c.hp -= 120 * delta; // Gaze destroys clover

          // Emit Particles
          for (let p = 0; p < 2; p++) {
            particles.push(new SparkParticle(c.x, c.y));
          }

          if (c.hp <= 0) {
            playShatterSound();
            score += Math.round(100 * combo);
            combo += 0.1;
            scoreDisplay.innerText = score;
            comboDisplay.innerText = combo.toFixed(1) + 'x';

            // Explode particles
            for (let p = 0; p < 25; p++) {
              particles.push(new SparkParticle(c.x, c.y));
            }
            clovers.splice(i, 1);
            continue;
          }
        } else {
          c.targetGazeTimer = Math.max(0, c.targetGazeTimer - delta);
        }

        // Missed Clover reaches bottom
        if (c.y - c.radius > canvas.height) {
          clovers.splice(i, 1);
          if (isPlaying) {
            combo = Math.max(1.0, combo - 0.3);
            comboDisplay.innerText = combo.toFixed(1) + 'x';
          }
        }
      }

      // 4. Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw(ctx);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // 5. Draw Cat & Ominous Gaze
      const eyePos = drawCat();
      drawGazeBeams(eyePos);

      if (isPlaying) {
        requestAnimationFrame(gameLoop);
      }
    }

    // Initial Render
    drawBackground();
    catImage.onload = () => {
      drawCat();
    };
  </script>
</body>
</html>
